name: obv3
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 7-15 * * 1-5'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OBV_PERIOD: ${{ github.event_name == 'workflow_dispatch' && '55d' || '5d' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy
      - run: python obv3.py
      - name: kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/obv3.json docs/obv3.html
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "obv3 güncelleme"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep 5
          done
