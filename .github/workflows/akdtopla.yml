name: akdtopla
on:
  workflow_dispatch:
  schedule:
    - cron: "20 7,9,11,13,15,17 * * 1-5"
permissions:
  contents: write
concurrency:
  group: akdtopla
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas lxml
      - run: python akdtopla.py
      - name: Sonucu kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/akd.json docs/akd_seen.json docs/akd.html
          git commit -m "akd toplama" || echo "degisiklik yok"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
