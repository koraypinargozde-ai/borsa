name: obv2
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Veri süresi (5d, 30d, 59d)"
        default: "30d"
  schedule:
    - cron: "8,18,28,38,48,58 7-14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: obv2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python obv2.py
        env:
          OBV_PERIOD: ${{ github.event.inputs.period || '5d' }}
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add docs/obv2.html docs/obv2.json
          git commit -m "obv2" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
