name: diverjans
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python diverjans.py
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/diverjans.html
          git commit -m "diverjans testi" || echo "degisiklik yok"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
