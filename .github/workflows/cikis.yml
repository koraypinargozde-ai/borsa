name: cikis
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python cikis.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/cikis.html
          git commit -m "cikis test" || echo "degisiklik yok"
          git pull --rebase
          git push
