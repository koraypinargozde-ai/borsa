name: tara
on:
  schedule:
    - cron: "7,22,37,52 7-14 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python scan.py
      - run: python post.py
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: python defter.py
        continue-on-error: true
      - run: python hacim.py
        continue-on-error: true
      - run: python yztakip.py
        continue-on-error: true
      - run: python obvekle.py
        continue-on-error: true
      - run: python harmonikekle.py
        continue-on-error: true
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "guncelle" || echo "degisiklik yok"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
