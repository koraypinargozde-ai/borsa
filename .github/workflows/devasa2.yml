name: devasa2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python devasa2.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/devasa2.html
          git commit -m "devasa2" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
