name: zirve60
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python zirve60.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/zirve60.html
          git commit -m "zirve60 testi" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
